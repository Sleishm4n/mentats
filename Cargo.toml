[package]
name = "mentats"
version = "0.2.0"
edition = "2021"
authors = ["Sam Leishman <Sam.g.leishman@gmail.com>"]
description = "A from-scratch neural network library in Rust, built to understand deep learning fundamentals through implementation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sleishm4n/mentats"
homepage = "https://github.com/Sleishm4n/mentats"
documentation = "https://docs.rs/mentats"
readme = "README.md"
keywords = ["neural-network", "machine-learning", "deep-learning", "vae"]
categories = ["science", "algorithms"]
exclude = ["/checkpoints", "/images", "/data", "/outputs"]

[dependencies]
rand = "0.8"
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "nn_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1